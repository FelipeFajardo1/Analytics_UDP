name: Test and deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Validate Python application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py src

      - name: Run tests when available
        shell: bash
        run: |
          if find . -path './.git' -prune -o -path './.venv' -prune -o \
            -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .
          then
            python -m pip install pytest
            python -m pytest
          else
            echo "No automated tests found; Python compilation passed."
          fi

  deploy:
    name: Package validated application
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir deployment
          cp -r app.py src requirements.txt README.md deployment/
          tar -czf analytics-academico-itp.tar.gz -C deployment .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: analytics-academico-itp-${{ github.sha }}
          path: analytics-academico-itp.tar.gz
          if-no-files-found: error
          retention-days: 30
